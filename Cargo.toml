[package]
name = "lau-signal-processing"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-signal-processing"
description = "Digital signal processing — filters, transforms, spectral analysis, and adaptive filtering for agent telemetry streams"

[dependencies]
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
num-complex = "0.4"
num-traits = "0.2"

[dev-dependencies]
approx = "0.5"
